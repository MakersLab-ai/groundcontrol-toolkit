# Release: push a tag v<version> on main. goreleaser builds gc for
# darwin/linux × amd64/arm64 (CGO off, version from the tag via -ldflags),
# packs gc_<os>_<arch>.tar.gz, writes checksums.txt and creates the GitHub
# release with install.sh attached:
#   git tag v0.2.0 && git push origin v0.2.0
# darwin/arm64 needs no separate signing step: Go's linker ad-hoc signs it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: sh scripts/validate-skills.sh
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
